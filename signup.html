<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Create a free Khatabook account — your smart digital account book">
        <title>Sign Up — Khatabook</title>
        <link rel="stylesheet" href="auth.css">
    </head>
    <body>
        <div class="container">
            <h1>Create Account</h1>
            <p>Start managing your business for free</p>
            <input type="text"     id="name"     placeholder="Full name">
            <input type="email"    id="email"    placeholder="Email address">
            <input type="password" id="password" placeholder="Password (min 6 chars)">
            <button onclick="signup()">Create Account →</button>
            <p>Already have an account? <a href="login.html">Sign in</a></p>
        </div>
        <script src="config.js"></script>
        <script src="signup.js"></script>
    </body>
</html>
